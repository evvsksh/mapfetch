[package]
name = "mapfetch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
sysinfo = "0.40.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }
